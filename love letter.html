}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="love letter.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>Love letter</title>
    <style>
      /* Reproductor flotante */
      #music-player {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: rgba(255, 79, 129, 0.92);
        border-radius: 50px;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(255,79,129,0.4);
        z-index: 999;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.5s ease, transform 0.5s ease;
        pointer-events: none;
        font-family: sans-serif;
      }
      #music-player.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: all;
      }
      #music-player span {
        color: white;
        font-size: 0.8em;
        white-space: nowrap;
      }
      #toggle-btn {
        background: white;
        border: none;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        cursor: pointer;
        font-size: 1em;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.2s;
      }
      #toggle-btn:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>

    <!-- 🎵 Cambia "cancion.mp3" por el nombre de tu archivo -->
    <audio id="bg-music" loop preload="auto">
      <source src="Calle 13 - No Hay Nadie Como Tú (Video) ft. Café Tacuba.mp3" type="audio/mpeg">
    </audio>

    <!-- Reproductor flotante -->
    <div id="music-player">
      <button id="toggle-btn" onclick="toggleMusic()">⏸️</button>
      <span>♪ música</span>
    </div>

    <div class="container">  
      <div class="valentines">
        <div class="envelope"></div>
        <div class="front"></div>
        <div class="card">
          <div class="text">To my</br>grirl </br>I love You!</div>
          <div class="heart"></div>
        </div>
        <div class="hearts">
          <div class="one"></div>
          <div class="two"></div>
          <div class="three"></div>
          <div class="four"></div>
          <div class="five"></div>
        </div>
      </div>
    </div>
    <div class="shadow"></div>

    <script src="love letter.js"></script>
    <script>
      const music = document.getElementById("bg-music");
      const player = document.getElementById("music-player");
      const toggleBtn = document.getElementById("toggle-btn");
      let musicStarted = false;

      // Arranca la música en el primer toque/clic del usuario (requerido en móvil)
      function startMusic() {
        if (!musicStarted) {
          music.volume = 0.6;
          music.play().then(() => {
            musicStarted = true;
            player.classList.add("visible");
          }).catch(() => {});
        }
      }

      function toggleMusic() {
        if (music.paused) {
          music.play();
          toggleBtn.textContent = "⏸️";
        } else {
          music.pause();
          toggleBtn.textContent = "▶️";
        }
      }

      // Escucha el primer toque en cualquier parte de la página
      document.addEventListener("click", startMusic, { once: true });
      document.addEventListener("touchstart", startMusic, { once: true });
    </script>
  </body>
</html>
